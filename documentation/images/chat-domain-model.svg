<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 1040" width="650" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chat-domain-model-title chat-domain-model-desc">
      <title id="chat-domain-model-title">Chat conversation domain model</title>
      <desc id="chat-domain-model-desc">Class diagram of the containment chain: a Conversation owns one History, the History is delivered as one or more Pages, each Page contains one or more Events and carries at most one Cursor addressing the next older page, and every Event is a text message, a carousel, a quick reply, or a control event that renders nothing.</desc>
      <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="uml-triangle" markerWidth="16" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse">
          <polygon points="0 0, 16 6, 0 12" fill="#f1f4f9" stroke="#172033" stroke-width="1"/>
        </marker>
        <marker id="uml-diamond-filled" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
          <polygon points="0 5, 9 0, 18 5, 9 10" fill="#172033"/>
        </marker>
        <marker id="uml-diamond-hollow" markerWidth="18" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="userSpaceOnUse">
          <polygon points="0 5, 9 0, 18 5, 9 10" fill="#f1f4f9" stroke="#172033" stroke-width="1"/>
        </marker>
        <marker id="uml-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L9,4 L0,8" fill="none" stroke="#5f6b7a" stroke-width="1"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f1f4f9"/>

      <!-- ============ Relationships (drawn before boxes) ============ -->

      <!-- Conversation owns its History (composition) -->
      <line x1="500" y1="144" x2="500" y2="216" stroke="#5f6b7a" stroke-width="1" marker-start="url(#uml-diamond-filled)"/>

      <!-- History is delivered as Pages (aggregation) -->
      <line x1="500" y1="324" x2="500" y2="396" stroke="#5f6b7a" stroke-width="1" marker-start="url(#uml-diamond-hollow)"/>

      <!-- Page groups Events (aggregation) -->
      <line x1="500" y1="524" x2="500" y2="596" stroke="#5f6b7a" stroke-width="1" marker-start="url(#uml-diamond-hollow)"/>

      <!-- Page addresses the next older page through a Cursor (association, accent) -->
      <line x1="620" y1="466" x2="716" y2="466" stroke="#405cf5" stroke-width="1" marker-end="url(#uml-open)"/>

      <!-- Notes attached with dotted leaders -->
      <line x1="320" y1="466" x2="380" y2="466" stroke="#8b95a5" stroke-width="1" stroke-dasharray="2,3"/>
      <line x1="840" y1="514" x2="840" y2="544" stroke="#8b95a5" stroke-width="1" stroke-dasharray="2,3"/>

      <!-- Event generalisation tree -->
      <line x1="500" y1="812" x2="500" y2="771" stroke="#405cf5" stroke-width="1" marker-end="url(#uml-triangle)"/>
      <line x1="148" y1="812" x2="852" y2="812" stroke="#405cf5" stroke-width="1"/>
      <line x1="148" y1="812" x2="148" y2="850" stroke="#405cf5" stroke-width="1"/>
      <line x1="383" y1="812" x2="383" y2="850" stroke="#405cf5" stroke-width="1"/>
      <line x1="617" y1="812" x2="617" y2="850" stroke="#405cf5" stroke-width="1"/>
      <line x1="852" y1="812" x2="852" y2="850" stroke="#405cf5" stroke-width="1"/>

      <!-- ============ Relationship labels and multiplicities ============ -->

      <!-- OWNS -->
      <text x="514" y="185" fill="#5f6b7a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">OWNS</text>
      <text x="488" y="172" fill="#172033" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" font-weight="600">1</text>
      <text x="488" y="210" fill="#172033" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" font-weight="600">1</text>

      <!-- PAGED INTO -->
      <text x="514" y="365" fill="#5f6b7a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PAGED INTO</text>
      <text x="488" y="352" fill="#172033" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" font-weight="600">1</text>
      <text x="488" y="390" fill="#172033" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" font-weight="600">1..n</text>

      <!-- CONTAINS -->
      <text x="514" y="565" fill="#5f6b7a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CONTAINS</text>
      <text x="488" y="552" fill="#172033" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" font-weight="600">1</text>
      <text x="488" y="590" fill="#172033" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" font-weight="600">0..n</text>

      <!-- NEXT OLDER PAGE -->
      <text x="668" y="458" fill="#405cf5" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEXT OLDER</text>
      <text x="710" y="480" fill="#172033" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" font-weight="600">0..1</text>

      <!-- ============ Classes ============ -->

      <!-- Conversation -->
      <rect x="380" y="40" width="240" height="100" rx="6" fill="#ffffff" stroke="#172033" stroke-width="1"/>
      <line x1="380" y1="80" x2="620" y2="80" stroke="rgba(23,32,51,0.22)" stroke-width="1"/>
      <text x="500" y="64" fill="#172033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Conversation</text>
      <text x="396" y="100" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">+ chatId: String</text>
      <text x="396" y="120" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">+ endCustomerId: String</text>

      <!-- History -->
      <rect x="380" y="220" width="240" height="104" rx="6" fill="#ffffff" stroke="#172033" stroke-width="1"/>
      <line x1="380" y1="260" x2="620" y2="260" stroke="rgba(23,32,51,0.22)" stroke-width="1"/>
      <text x="500" y="244" fill="#172033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">History</text>
      <text x="396" y="280" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">the whole event log,</text>
      <text x="396" y="300" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">ordered oldest → newest</text>

      <!-- Page -->
      <rect x="380" y="400" width="240" height="124" rx="6" fill="rgba(23,32,51,0.05)" stroke="#5f6b7a" stroke-width="1"/>
      <line x1="380" y1="440" x2="620" y2="440" stroke="rgba(23,32,51,0.22)" stroke-width="1"/>
      <text x="500" y="424" fill="#172033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Page</text>
      <text x="396" y="460" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">+ events: Event[]</text>
      <text x="396" y="480" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">+ hasMore: Boolean</text>
      <text x="396" y="500" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">+ nextCursor: Cursor | null</text>

      <!-- Cursor -->
      <rect x="720" y="418" width="240" height="96" rx="6" fill="rgba(64,92,245,0.04)" stroke="#405cf5" stroke-width="1"/>
      <rect x="720" y="418" width="240" height="40" rx="6" fill="rgba(64,92,245,0.10)"/>
      <rect x="720" y="450" width="240" height="8" fill="rgba(64,92,245,0.10)"/>
      <line x1="720" y1="458" x2="960" y2="458" stroke="rgba(64,92,245,0.40)" stroke-width="1"/>
      <text x="840" y="442" fill="#172033" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cursor</text>
      <text x="736" y="478" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">+ after: String (opaque)</text>
      <text x="736" y="498" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">null ⇒ start of chat</text>

      <!-- Event — abstract, focal -->
      <rect x="380" y="600" width="240" height="170" rx="6" fill="rgba(64,92,245,0.04)" stroke="#405cf5" stroke-width="1"/>
      <rect x="380" y="600" width="240" height="40" rx="6" fill="rgba(64,92,245,0.10)"/>
      <rect x="380" y="632" width="240" height="8" fill="rgba(64,92,245,0.10)"/>
      <line x1="380" y1="640" x2="620" y2="640" stroke="rgba(64,92,245,0.40)" stroke-width="1"/>
      <line x1="380" y1="716" x2="620" y2="716" stroke="rgba(64,92,245,0.40)" stroke-width="1"/>
      <text x="500" y="624" fill="#172033" font-size="12" font-weight="600" font-style="italic" font-family="'Geist', sans-serif" text-anchor="middle">Event</text>
      <text x="396" y="660" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">+ _id: String</text>
      <text x="396" y="680" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">+ type: String</text>
      <text x="396" y="700" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">+ sentDate: ISODateTime</text>
      <text x="396" y="736" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">+ batchId?: String</text>
      <text x="396" y="756" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">+ render(): Message | null</text>

      <!-- ============ Notes ============ -->

      <!-- How a page arrives -->
      <path d="M 40,418 H 300 L 320,438 V 514 H 40 Z" fill="rgba(95,107,122,0.08)" stroke="#8b95a5" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="56" y="440" fill="#5f6b7a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HOW A PAGE ARRIVES</text>
      <text x="56" y="462" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">newest ← SYNC_EVENT_LOG</text>
      <text x="56" y="480" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">older  ← GET /history?after=…</text>
      <text x="56" y="502" fill="#5f6b7a" font-size="8.5" font-style="italic" font-family="'Geist', sans-serif">A page is a window over the log, not a stored container.</text>

      <!-- Who issues the first cursor -->
      <path d="M 720,544 H 940 L 960,564 V 616 H 720 Z" fill="rgba(64,92,245,0.05)" stroke="#405cf5" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="736" y="566" fill="#405cf5" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WHO ISSUES IT</text>
      <text x="736" y="586" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">SYNC_EVENT_LOG.META gives</text>
      <text x="736" y="604" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">the first one; pages the rest.</text>

      <!-- ============ Event subtypes ============ -->

      <!-- TextMessage -->
      <rect x="40" y="850" width="215" height="110" rx="6" fill="#ffffff" stroke="#172033" stroke-width="1"/>
      <line x1="40" y1="886" x2="255" y2="886" stroke="rgba(23,32,51,0.22)" stroke-width="1"/>
      <text x="148" y="872" fill="#172033" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">TextMessage</text>
      <text x="56" y="906" fill="#5f6b7a" font-size="8.5" font-family="'Geist Mono', monospace">ADD_MESSAGE.*.TEXT</text>
      <text x="56" y="926" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">+ text: String</text>
      <text x="56" y="946" fill="#405cf5" font-size="8.5" font-family="'Geist Mono', monospace">→ one bubble</text>

      <!-- Carousel -->
      <rect x="275" y="850" width="215" height="110" rx="6" fill="#ffffff" stroke="#172033" stroke-width="1"/>
      <line x1="275" y1="886" x2="490" y2="886" stroke="rgba(23,32,51,0.22)" stroke-width="1"/>
      <text x="383" y="872" fill="#172033" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Carousel</text>
      <text x="291" y="906" fill="#5f6b7a" font-size="8.5" font-family="'Geist Mono', monospace">…ASSISTANT.CAROUSEL</text>
      <text x="291" y="926" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">+ items: ProductItem[]</text>
      <text x="291" y="946" fill="#405cf5" font-size="8.5" font-family="'Geist Mono', monospace">→ one card row</text>

      <!-- QuickReply -->
      <rect x="510" y="850" width="215" height="110" rx="6" fill="#ffffff" stroke="#172033" stroke-width="1"/>
      <line x1="510" y1="886" x2="725" y2="886" stroke="rgba(23,32,51,0.22)" stroke-width="1"/>
      <text x="617" y="872" fill="#172033" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">QuickReply</text>
      <text x="526" y="906" fill="#5f6b7a" font-size="8.5" font-family="'Geist Mono', monospace">…ASSISTANT.QUICK_REPLY</text>
      <text x="526" y="926" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">+ options: Option[]</text>
      <text x="526" y="946" fill="#405cf5" font-size="8.5" font-family="'Geist Mono', monospace">→ chips under the input</text>

      <!-- ControlEvent -->
      <rect x="745" y="850" width="215" height="110" rx="6" fill="rgba(95,107,122,0.10)" stroke="#8b95a5" stroke-width="1"/>
      <line x1="745" y1="886" x2="960" y2="886" stroke="rgba(23,32,51,0.22)" stroke-width="1"/>
      <text x="852" y="872" fill="#172033" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ControlEvent</text>
      <text x="761" y="906" fill="#5f6b7a" font-size="8.5" font-family="'Geist Mono', monospace">SYNC_EVENT_LOG.META</text>
      <text x="761" y="926" fill="#5f6b7a" font-size="8.5" font-family="'Geist Mono', monospace">FE.SET_CONTEXT · ERROR</text>
      <text x="761" y="946" fill="#405cf5" font-size="8.5" font-family="'Geist Mono', monospace">→ nothing; sets state</text>

      <!-- ============ Legend ============ -->
      <line x1="40" y1="995" x2="960" y2="995" stroke="rgba(23,32,51,0.10)" stroke-width="0.8"/>
      <text x="40" y="1011" fill="#5f6b7a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · RELATIONSHIPS</text>

      <line x1="240" y1="1007" x2="268" y2="1007" stroke="#172033" stroke-width="1" marker-end="url(#uml-triangle)"/>
      <text x="276" y="1011" fill="#5f6b7a" font-size="8.5" font-family="'Geist', sans-serif">Inheritance · is a</text>

      <line x1="400" y1="1007" x2="428" y2="1007" stroke="#172033" stroke-width="1" marker-start="url(#uml-diamond-filled)"/>
      <text x="454" y="1011" fill="#5f6b7a" font-size="8.5" font-family="'Geist', sans-serif">Composition · owns</text>

      <line x1="580" y1="1007" x2="608" y2="1007" stroke="#172033" stroke-width="1" marker-start="url(#uml-diamond-hollow)"/>
      <text x="634" y="1011" fill="#5f6b7a" font-size="8.5" font-family="'Geist', sans-serif">Aggregation · groups</text>

      <line x1="780" y1="1007" x2="808" y2="1007" stroke="#5f6b7a" stroke-width="1" marker-end="url(#uml-open)"/>
      <text x="816" y="1011" fill="#5f6b7a" font-size="8.5" font-family="'Geist', sans-serif">Association · points to</text>
    </svg>
