<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 750" width="1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chat-init-sequence-title chat-init-sequence-desc">
      <title id="chat-init-sequence-title">Chat client initialization and history paging</title>
      <desc id="chat-init-sequence-desc">Sequence diagram: the storefront page mounts the chat client, which resolves a chatId, fetches general-settings, pushes FE.SET_CONTEXT, then always sends SYNC_EVENT_LOG. A chat with history answers with SYNC_EVENT_LOG.META and its newest page; a brand-new chatId answers with a cold-start welcome message. Older pages are then fetched in a loop from the history endpoint while hasMore is true.</desc>
      <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="seq-call" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
          <polygon points="0 0, 10 4, 0 8" fill="#172033"/>
        </marker>
        <marker id="seq-return" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L9,4 L0,8" fill="none" stroke="#5f6b7a" stroke-width="1"/>
        </marker>
        <marker id="seq-self" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L9,4 L0,8" fill="none" stroke="#405cf5" stroke-width="1"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f1f4f9"/>

      <!-- ============ Lifelines ============ -->
      <line x1="120" y1="60" x2="120" y2="726" stroke="#8b95a5" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="420" y1="60" x2="420" y2="726" stroke="#8b95a5" stroke-width="1" stroke-dasharray="4,4"/>
      <line x1="800" y1="60" x2="800" y2="726" stroke="#8b95a5" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- ============ Participants ============ -->
      <rect x="30" y="24" width="180" height="36" rx="5" fill="rgba(95,107,122,0.10)" stroke="#8b95a5" stroke-width="1"/>
      <text x="120" y="42" fill="#172033" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Storefront page</text>
      <text x="120" y="54" fill="#5f6b7a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">outer layer</text>

      <rect x="330" y="24" width="180" height="36" rx="5" fill="#ffffff" stroke="#172033" stroke-width="1"/>
      <text x="420" y="42" fill="#172033" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chat client</text>
      <text x="420" y="54" fill="#5f6b7a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">the widget you build</text>

      <rect x="690" y="24" width="220" height="36" rx="5" fill="rgba(64,92,245,0.08)" stroke="#405cf5" stroke-width="1"/>
      <text x="800" y="42" fill="#172033" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Conversational Agent API</text>
      <text x="800" y="54" fill="#5f6b7a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/ca/v1/agents/{agentId}</text>

      <!-- ============ Activation bars ============ -->
      <rect x="414" y="92" width="12" height="634" fill="#ffffff" stroke="#172033" stroke-width="1"/>
      <rect x="794" y="156" width="12" height="42" fill="rgba(64,92,245,0.12)" stroke="#405cf5" stroke-width="1"/>
      <rect x="794" y="250" width="12" height="42" fill="rgba(64,92,245,0.12)" stroke="#405cf5" stroke-width="1"/>
      <rect x="794" y="310" width="12" height="194" fill="rgba(64,92,245,0.12)" stroke="#405cf5" stroke-width="1"/>
      <rect x="794" y="600" width="12" height="42" fill="rgba(64,92,245,0.12)" stroke="#405cf5" stroke-width="1"/>

      <!-- ============ 1 &#183; Mount ============ -->
      <line x1="120" y1="92" x2="412" y2="92" stroke="#172033" stroke-width="1" marker-end="url(#seq-call)"/>
      <text x="266" y="86" fill="#172033" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mount(apiUrl, agentId, token, currency)</text>

      <path d="M 426,116 H 462 V 134 H 428" fill="none" stroke="#405cf5" stroke-width="1" marker-end="url(#seq-self)"/>
      <text x="472" y="120" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">chatId &#8592; localStorage.CHAT_ID ?? uuid v7()</text>
      <text x="472" y="134" fill="#5f6b7a" font-size="8.5" font-style="italic" font-family="'Geist', sans-serif">rotated on New chat; endCustomerId never changes</text>

      <!-- ============ 2 &#183; Branding and i18n ============ -->
      <line x1="426" y1="162" x2="792" y2="162" stroke="#172033" stroke-width="1" marker-end="url(#seq-call)"/>
      <text x="609" y="156" fill="#172033" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GET /general-settings</text>

      <line x1="794" y1="192" x2="428" y2="192" stroke="#5f6b7a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#seq-return)"/>
      <text x="611" y="186" fill="#5f6b7a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">branding &#183; translated &#183; staticReplies</text>

      <path d="M 426,214 H 462 V 232 H 428" fill="none" stroke="#405cf5" stroke-width="1" marker-end="url(#seq-self)"/>
      <text x="472" y="218" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">apply i18n before the first paint</text>
      <text x="472" y="232" fill="#5f6b7a" font-size="8.5" font-style="italic" font-family="'Geist', sans-serif">cache 6 h per agentId</text>

      <!-- ============ 3 &#183; Context ============ -->
      <line x1="426" y1="256" x2="792" y2="256" stroke="#172033" stroke-width="1" marker-end="url(#seq-call)"/>
      <text x="609" y="250" fill="#172033" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST send-event { FE.SET_CONTEXT }</text>

      <line x1="794" y1="286" x2="428" y2="286" stroke="#5f6b7a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#seq-return)"/>
      <text x="611" y="280" fill="#5f6b7a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stream &#183; context asserted back</text>

      <!-- ============ 4 &#183; Sync, always sent ============ -->
      <line x1="426" y1="316" x2="792" y2="316" stroke="#172033" stroke-width="1" marker-end="url(#seq-call)"/>
      <text x="609" y="310" fill="#172033" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST send-event { SYNC_EVENT_LOG, limit &#8804; 500 }</text>

      <!-- ============ alt &#183; what the sync answers with ============ -->
      <rect x="340" y="334" width="630" height="200" rx="4" fill="none" stroke="#172033" stroke-width="1"/>
      <path d="M 340,334 H 392 L 404,346 V 356 H 340 Z" fill="rgba(23,32,51,0.06)" stroke="#172033" stroke-width="1"/>
      <text x="350" y="349" fill="#172033" font-size="8.5" font-weight="600" font-family="'Geist Mono', monospace">alt</text>
      <rect x="410" y="340" width="200" height="12" fill="#f1f4f9"/>
      <text x="414" y="349" fill="#5f6b7a" font-size="8.5" font-family="'Geist Mono', monospace">[ the chat has history to replay ]</text>

      <line x1="794" y1="374" x2="428" y2="374" stroke="#405cf5" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#seq-return)"/>
      <text x="611" y="368" fill="#405cf5" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">&#9312; SYNC_EVENT_LOG.META &#8212; hasMore, nextCursor, state</text>

      <line x1="794" y1="400" x2="428" y2="400" stroke="#5f6b7a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#seq-return)"/>
      <text x="611" y="394" fill="#5f6b7a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">&#9313; the newest page &#8212; events, oldest-first</text>

      <path d="M 426,420 H 462 V 438 H 428" fill="none" stroke="#405cf5" stroke-width="1" marker-end="url(#seq-self)"/>
      <text x="472" y="424" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">cursor &#8592; nextCursor &#183; dedupe by _id</text>
      <text x="472" y="438" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">show &#8220;Load earlier&#8221; when hasMore</text>

      <line x1="340" y1="460" x2="970" y2="460" stroke="#172033" stroke-width="1" stroke-dasharray="5,4"/>
      <rect x="346" y="467" width="124" height="12" fill="#f1f4f9"/>
      <text x="350" y="476" fill="#5f6b7a" font-size="8.5" font-family="'Geist Mono', monospace">[ brand-new chatId ]</text>

      <line x1="794" y1="498" x2="428" y2="498" stroke="#5f6b7a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#seq-return)"/>
      <text x="611" y="492" fill="#5f6b7a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ADD_MESSAGE.ASSISTANT.COLD_START &#8212; the welcome message</text>
      <text x="472" y="518" fill="#5f6b7a" font-size="8.5" font-style="italic" font-family="'Geist', sans-serif">no paging state to set &#8212; a fresh chat has no cursor and no earlier pages</text>

      <!-- ============ loop &#183; page backwards ============ -->
      <rect x="340" y="562" width="630" height="154" rx="4" fill="none" stroke="#172033" stroke-width="1"/>
      <path d="M 340,562 H 396 L 408,574 V 584 H 340 Z" fill="rgba(23,32,51,0.06)" stroke="#172033" stroke-width="1"/>
      <text x="350" y="577" fill="#172033" font-size="8.5" font-weight="600" font-family="'Geist Mono', monospace">loop</text>
      <rect x="414" y="568" width="346" height="12" fill="#f1f4f9"/>
      <text x="418" y="577" fill="#5f6b7a" font-size="8.5" font-family="'Geist Mono', monospace">[ hasMore &amp;&amp; cursor &#8800; null &#8212; shopper taps &#8220;Load earlier&#8221; ]</text>

      <line x1="426" y1="606" x2="792" y2="606" stroke="#172033" stroke-width="1" marker-end="url(#seq-call)"/>
      <text x="609" y="600" fill="#172033" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GET /history?after=&lt;cursor&gt;&amp;limit=100</text>

      <line x1="794" y1="636" x2="428" y2="636" stroke="#5f6b7a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#seq-return)"/>
      <text x="611" y="630" fill="#5f6b7a" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">{ events (oldest-first), nextCursor, hasMore }</text>

      <path d="M 426,658 H 462 V 676 H 428" fill="none" stroke="#405cf5" stroke-width="1" marker-end="url(#seq-self)"/>
      <text x="472" y="662" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">prepend above the thread &#183; keep scroll</text>
      <text x="472" y="676" fill="#172033" font-size="9" font-family="'Geist Mono', monospace">cursor &#8592; nextCursor</text>
      <text x="472" y="698" fill="#5f6b7a" font-size="8.5" font-style="italic" font-family="'Geist', sans-serif">a page may arrive empty and still have hasMore &#8212; stop on hasMore, never on the count</text>

      <!-- ============ Legend &#183; parked clear of the Storefront lifeline ============ -->
      <line x1="145" y1="386" x2="335" y2="386" stroke="rgba(23,32,51,0.10)" stroke-width="0.8"/>
      <text x="155" y="404" fill="#5f6b7a" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND &#183; MESSAGES</text>

      <line x1="155" y1="428" x2="183" y2="428" stroke="#172033" stroke-width="1" marker-end="url(#seq-call)"/>
      <text x="195" y="432" fill="#5f6b7a" font-size="8.5" font-family="'Geist', sans-serif">Request</text>

      <line x1="155" y1="456" x2="183" y2="456" stroke="#5f6b7a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#seq-return)"/>
      <text x="195" y="460" fill="#5f6b7a" font-size="8.5" font-family="'Geist', sans-serif">Response &#183; streamed</text>

      <path d="M 155,478 H 175 V 490 H 157" fill="none" stroke="#405cf5" stroke-width="1" marker-end="url(#seq-self)"/>
      <text x="195" y="488" fill="#5f6b7a" font-size="8.5" font-family="'Geist', sans-serif">Local state, no call</text>

      <rect x="155" y="509" width="28" height="14" rx="2" fill="none" stroke="#172033" stroke-width="1"/>
      <text x="195" y="520" fill="#5f6b7a" font-size="8.5" font-family="'Geist', sans-serif">alt / loop fragment</text>

      <rect x="155" y="537" width="8" height="14" fill="#ffffff" stroke="#172033" stroke-width="1"/>
      <text x="195" y="548" fill="#5f6b7a" font-size="8.5" font-family="'Geist', sans-serif">Activation</text>
    </svg>
