<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" role="img" aria-label="Mock chat showing the fatal-error fallback message">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <rect x="0" y="0" width="320" height="100" rx="16" fill="#f1f4f9" stroke="#d8dee9"/>
  <rect x="8" y="8" width="304" height="84" rx="14" fill="#ffffff" stroke="#d8dee9"/>

  <rect x="22" y="22" width="270" height="34" rx="14" fill="#ffffff" stroke="#d92d20"/>
  <text x="34" y="43" fill="#d92d20" font-size="11">Something went wrong. Please try again.</text>
  <text x="160" y="76" text-anchor="middle" fill="#5f6b7a" font-size="11">↑ translated.errorMsg on FATAL_ERROR</text>
</svg>
