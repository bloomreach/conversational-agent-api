<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" role="img" aria-label="Mock chat showing a feedback / rating prompt">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <rect x="0" y="0" width="320" height="150" rx="16" fill="#f1f4f9" stroke="#d8dee9"/>
  <rect x="8" y="8" width="304" height="134" rx="14" fill="#ffffff" stroke="#d8dee9"/>

  <text x="160" y="30" text-anchor="middle" fill="#5f6b7a" font-size="11">How was your experience?</text>
  <text x="160" y="58" text-anchor="middle" fill="#0f9f8f" font-size="20" letter-spacing="4">★ ★ ★ ★ ☆</text>
  <rect x="32" y="76" width="256" height="28" rx="8" fill="#f6f8fc" stroke="#d8dee9"/>
  <text x="44" y="94" fill="#5f6b7a" font-size="11">Tell us more (optional)…</text>
  <rect x="130" y="114" width="60" height="26" rx="13" fill="#ffffff" stroke="#405cf5" stroke-width="1.2"/>
  <text x="160" y="131" text-anchor="middle" fill="#172033" font-size="11">Submit</text>
</svg>
